name: Deploy Philologia to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Download public-domain Apollo photograph
        run: |
          curl -fLsS --retry 3 --retry-delay 2 \
            -A "Philologia preview generator" \
            "https://commons.wikimedia.org/wiki/Special:Redirect/file/Marble_head_of_Apollo_with_fragment_of_his_hand_MET_DP282116.jpg" \
            -o apollo-og.jpg
          test "$(file --brief --mime-type apollo-og.jpg)" = "image/jpeg"
          test "$(stat -c%s apollo-og.jpg)" -gt 100000
      - name: Render social preview image
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert --format=png --width=1200 --height=630 philologia-og.svg > philologia-og-v3.png
          file philologia-og-v3.png
          test "$(file --brief --mime-type philologia-og-v3.png)" = "image/png"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Wait until the Pages artifact is visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected="github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for attempt in {1..12}; do
            count="$(curl -fsS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
              | jq --arg name "$expected" '[.artifacts[] | select(.name == $name)] | length')"
            if [ "$count" = "1" ]; then
              echo "Pages artifact is registered: $expected"
              exit 0
            fi
            echo "Waiting for Pages artifact registration ($attempt/12; found $count)"
            sleep 5
          done
          echo "Pages artifact did not become visible: $expected"
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
