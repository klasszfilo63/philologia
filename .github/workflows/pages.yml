name: Deploy Philologia to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Download public-domain Apollo photograph
        run: |
          curl -fLsS --retry 3 --retry-delay 2 \
            -A "Philologia preview generator" \
            "https://commons.wikimedia.org/wiki/Special:Redirect/file/Marble_head_of_Apollo_with_fragment_of_his_hand_MET_DP282116.jpg" \
            -o apollo-og.jpg
          test "$(file --brief --mime-type apollo-og.jpg)" = "image/jpeg"
          test "$(stat -c%s apollo-og.jpg)" -gt 100000
      - name: Render social preview image
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert --format=png --width=1200 --height=630 philologia-og.svg > philologia-og-v3.png
          file philologia-og-v3.png
          test "$(file --brief --mime-type philologia-og-v3.png)" = "image/png"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
