<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Photograph: Marble head of Apollo with fragment of his hand, Roman, 1st-2nd c. CE.
       The Metropolitan Museum of Art, object 1980.303.2. CC0 1.0 via Wikimedia Commons. -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf3e2"/>
      <stop offset="1" stop-color="#eadbbd"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#201b1b" stop-opacity=".16"/>
      <stop offset="1" stop-color="#6d1820" stop-opacity=".04"/>
    </linearGradient>
    <clipPath id="photoClip"><rect x="22" y="22" width="445" height="586"/></clipPath>
    <filter id="warmPhoto" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values=".68"/>
      <feComponentTransfer>
        <feFuncR type="gamma" amplitude="1.03" exponent="1" offset="0"/>
        <feFuncG type="gamma" amplitude="1.00" exponent="1" offset="0"/>
        <feFuncB type="gamma" amplitude=".92" exponent="1" offset=".01"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#paper)"/>
  <rect x="12" y="12" width="1176" height="606" fill="none" stroke="#6d1820" stroke-width="3"/>
  <rect x="20" y="20" width="449" height="590" fill="#2a2524"/>
  <g clip-path="url(#photoClip)">
    <image x="22" y="22" width="445" height="586" xlink:href="apollo-og.jpg" preserveAspectRatio="xMidYMid slice" filter="url(#warmPhoto)"/>
    <rect x="22" y="22" width="445" height="586" fill="url(#shade)"/>
  </g>
  <path d="M484 74 V556" stroke="#b18b50" stroke-width="1.5"/>
  <text x="837" y="277" text-anchor="middle" fill="#6d1820" font-family="Georgia, 'Times New Roman', serif" font-size="93" font-style="italic" letter-spacing="-2">Philologia</text>
  <path d="M588 351 H720 M954 351 H1086" stroke="#b18b50" stroke-width="2.2"/>
  <g transform="translate(852 351)" fill="#b18b50" stroke="#8a6737" stroke-width="1.2">
    <path d="M0 0 C-25 -6 -45 -18 -57 -36 C-29 -31 -13 -18 0 0Z"/>
    <path d="M0 0 C-23 4 -43 13 -59 30 C-30 27 -13 15 0 0Z"/>
    <path d="M0 0 C25 -6 45 -18 57 -36 C29 -31 13 -18 0 0Z"/>
    <path d="M0 0 C23 4 43 13 59 30 C30 27 13 15 0 0Z"/>
  </g>
  <text x="837" y="435" text-anchor="middle" fill="#24364b" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-style="italic">Klasszikus nyelvek műhelye</text>
  <rect x="12" y="12" width="1176" height="606" fill="none" stroke="#9a7746" stroke-opacity=".45" stroke-width="1"/>
</svg>